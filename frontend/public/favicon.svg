<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1b29"/>
      <stop offset="70%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>

    <!-- Glowing Cyan/Teal Gradients -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(45, 212, 191, 0.35)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.65)"/>
    </linearGradient>

    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Pipe 1: Top (90deg) -->
  <g transform="translate(256, 256) rotate(0)">
    <rect x="-24" y="-210" width="48" height="120" rx="8" fill="url(#pipeGrad)" stroke="#2dd4bf" stroke-width="2"/>
    <!-- Pipe flanges & valve -->
    <rect x="-30" y="-210" width="60" height="16" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="0" cy="-150" r="18" fill="#0d9488" stroke="#2dd4bf" stroke-width="2"/>
    <polygon points="0,-162 10,-144 -10,-144" fill="#2dd4bf"/>
    <polygon points="0,-138 10,-156 -10,-156" fill="#2dd4bf"/>
    <!-- Arrows -->
    <path d="M-40,-130 L-40,-100 M-40,-100 L-46,-110 M-40,-100 L-34,-110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  </g>

  <!-- Pipe 2: Bottom-Right (120deg) -->
  <g transform="translate(256, 256) rotate(120)">
    <rect x="-24" y="-210" width="48" height="120" rx="8" fill="url(#pipeGrad)" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="-30" y="-210" width="60" height="16" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="0" cy="-150" r="18" fill="#0d9488" stroke="#2dd4bf" stroke-width="2"/>
    <polygon points="0,-162 10,-144 -10,-144" fill="#2dd4bf"/>
    <polygon points="0,-138 10,-156 -10,-156" fill="#2dd4bf"/>
    <!-- Arrows -->
    <path d="M-40,-130 L-40,-100 M-40,-100 L-46,-110 M-40,-100 L-34,-110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  </g>

  <!-- Pipe 3: Bottom-Left (240deg) -->
  <g transform="translate(256, 256) rotate(240)">
    <rect x="-24" y="-210" width="48" height="120" rx="8" fill="url(#pipeGrad)" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="-30" y="-210" width="60" height="16" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="0" cy="-150" r="18" fill="#0d9488" stroke="#2dd4bf" stroke-width="2"/>
    <polygon points="0,-162 10,-144 -10,-144" fill="#2dd4bf"/>
    <polygon points="0,-138 10,-156 -10,-156" fill="#2dd4bf"/>
    <!-- Arrows -->
    <path d="M-40,-130 L-40,-100 M-40,-100 L-46,-110 M-40,-100 L-34,-110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  </g>

  <!-- Central Hexagonal Memory Glass Shield -->
  <g transform="translate(256, 256)">
    <!-- Outer Glass Hexagon -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="url(#glassGrad)" stroke="#2dd4bf" stroke-width="4" filter="url(#neonGlow)"/>
    <!-- Inner Hexagon Accent -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>

    <!-- Circuit Board Memory Traces -->
    <g stroke="url(#glowGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)">
      <!-- Center Core Node -->
      <circle cx="0" cy="0" r="8" fill="#2dd4bf" stroke="#fff" stroke-width="2"/>

      <!-- Branch 1 (Up) -->
      <path d="M0,-8 L0,-40 L-20,-55"/>
      <path d="M0,-40 L20,-55"/>
      <circle cx="-20" cy="-55" r="4" fill="#38bdf8"/>
      <circle cx="20" cy="-55" r="4" fill="#38bdf8"/>

      <!-- Branch 2 (Bottom Right) -->
      <path d="M7,4 L35,20 L48,5"/>
      <path d="M35,20 L35,45"/>
      <circle cx="48" cy="5" r="4" fill="#2dd4bf"/>
      <circle cx="35" cy="45" r="4" fill="#2dd4bf"/>

      <!-- Branch 3 (Bottom Left) -->
      <path d="M-7,4 L-35,20 L-48,5"/>
      <path d="M-35,20 L-35,45"/>
      <circle cx="-48" cy="5" r="4" fill="#2dd4bf"/>
      <circle cx="-35" cy="45" r="4" fill="#2dd4bf"/>
    </g>
  </g>
</svg>
